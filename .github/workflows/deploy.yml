name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps --no-shell chromium
      - run: python -m pytest -q

  # Only main is deployed, and only after the tests pass.
  settings:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/update-settings.yml
    secrets: inherit

  deploy:
    needs: settings
    runs-on: ubuntu-latest
    env:
      READY: ${{ needs.settings.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: env.READY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always built on main so a broken Dockerfile shows up even before the secrets are set.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.READY == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Set up SSH
        if: env.READY == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to k3s
        if: env.READY == 'true'
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}:${GITHUB_SHA}|" k8s.yaml \
            | ssh debian@${{ secrets.VPS_HOST }} 'KUBECONFIG=$HOME/.kube/config kubectl apply -f -'
