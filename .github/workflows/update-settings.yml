name: Update settings

# Copies the CONFIG_TOML variable and the FB_AUTH_JSON / SMTP_PASSWORD / FBEDB_TOKEN secrets into the
# fbevents Secret on the server. The next run (daily or "Run now") uses them; nothing restarts.
# "Test and deploy" calls this too, so a deploy always carries the current settings.
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      ready:
        description: "true when all secrets and variables are set and were copied to the server"
        value: ${{ jobs.update.outputs.ready }}

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check secrets
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FB_AUTH_JSON: ${{ secrets.FB_AUTH_JSON }}
          CONFIG_TOML: ${{ vars.CONFIG_TOML }}
        run: |
          missing=""
          for s in VPS_HOST VPS_SSH_KEY SMTP_PASSWORD FB_AUTH_JSON CONFIG_TOML; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::warning::Not updating the server: add these repository secrets/variables first:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Check settings
        if: steps.check.outputs.ready == 'true'
        env:
          CONFIG_TOML: ${{ vars.CONFIG_TOML }}
          FB_AUTH_JSON: ${{ secrets.FB_AUTH_JSON }}
        run: |
          printf '%s\n' "$CONFIG_TOML" > /tmp/config.toml
          python3 -c "from fbevents.config import Config; Config.load('/tmp/config.toml')"
          python3 -c "import json, os; json.loads(os.environ['FB_AUTH_JSON'])" \
            || { echo "::error::FB_AUTH_JSON is not valid JSON: paste the whole state/auth.json"; exit 1; }
          rm /tmp/config.toml

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy settings and Facebook session to the server
        if: steps.check.outputs.ready == 'true'
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FB_AUTH_JSON: ${{ secrets.FB_AUTH_JSON }}
          CONFIG_TOML: ${{ vars.CONFIG_TOML }}
          FBEDB_TOKEN: ${{ secrets.FBEDB_TOKEN }}
        run: |
          dir=$(mktemp -d)
          printf '%s\n' "$CONFIG_TOML" > "$dir/config.toml"
          printf '%s\n' "$FB_AUTH_JSON" > "$dir/auth.json"
          # FBEDB_TOKEN is optional: without it the run just emails, as before fbedb.
          extra=()
          [ -n "$FBEDB_TOKEN" ] && extra+=(--from-literal=FBEDB_TOKEN="$FBEDB_TOKEN")
          kubectl create secret generic fbevents \
              --from-file=config.toml="$dir/config.toml" \
              --from-file=auth.json="$dir/auth.json" \
              --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
              "${extra[@]}" \
              --dry-run=client -o yaml \
            | ssh debian@${{ secrets.VPS_HOST }} 'KUBECONFIG=$HOME/.kube/config kubectl apply -f -'
          rm -rf "$dir"
