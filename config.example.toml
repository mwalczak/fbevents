# Copy to config.toml for local runs. On the server this whole file is the
# CONFIG_TOML repository variable (GitHub → Settings → Secrets and variables → Actions → Variables).

[location]
city = "Gdańsk"            # looked up on OpenStreetMap once; or set latitude/longitude below
# latitude = 54.352
# longitude = 18.646
radius_km = 30             # "nearby" events farther than this are skipped
timezone = "Europe/Warsaw"

[sources]
# Pages whose events you always want: paste the Page address as it is in the browser.
# With fbedb, manage Pages there instead (Manage Pages at https://fbedb.walczaki.com);
# the first run copies these into fbedb, after that this list is not used.
pages = [
  "https://www.facebook.com/SomeVenue",
  # "https://www.facebook.com/profile.php?id=100064000000000",
]
# Your town's events page: open facebook.com/events, pick the town in the location
# filter and copy the address. Add neighbouring towns if you like.
city_urls = [
  # "https://www.facebook.com/events/?discover_tab=RECOMMENDED&location_id=106151156083618",
]
pages_use_radius = false   # true = apply radius_km to events from your Pages too

[email]
smtp_host = "smtp.gmail.com"
smtp_port = 587            # 465 for SSL
username = "you@gmail.com"
# password: set the SMTP_PASSWORD environment variable (a Gmail App Password)
to = ["you@gmail.com"]
send_when_empty = false    # true = also mail "No new events today"

[fbedb]
# Where events are saved and Pages are managed. On the server this is set for you
# (http://fbedb inside the cluster) and used once the FBEDB_TOKEN secret is set.
# For local runs: url = "https://fbedb.walczaki.com" and FBEDB_TOKEN in the environment.
# url = "https://fbedb.walczaki.com"

[browser]
locale = "pl-PL"
max_event_pages = 40       # new event pages opened per run at most; the rest wait for the next run
# pause_seconds = [4, 12]  # random pause between pages
# start_delay_minutes = 30 # random wait before starting (skip with run --no-delay)
# user_agent = ""          # default: desktop Chrome on Linux, same version as the bundled browser
# chromium_path = ""       # use another Chromium binary
